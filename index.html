<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0E0D">
<meta name="description" content="Abdulrahman Alsaadi — Mechatronics engineer. Robotic systems from CAD to flight test: mechanical design, FEA, ROS 2, embedded control and vision-guided autonomy.">
<title>Abdulrahman Alsaadi | Mechatronics Engineer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#129302;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E0D;--card:rgba(255,255,255,.04);--em:#10B981;--deep:#006C35;--tx:#F9FAFB;--mu:#9CA3AF;--bd:rgba(16,185,129,.16)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 16px/1.65 Manrope,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--em);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
h1,h2,h3,.disp{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;line-height:.94;letter-spacing:-.01em}
h1{font-size:clamp(56px,12vw,164px)}
h2{font-size:clamp(38px,5.6vw,72px)}
h3{font-size:27px;line-height:1.05}
.mu{color:var(--mu)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.k{font:600 12.5px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--em);display:block;margin-bottom:12px}

/* ---------- hero ---------- */
.hero{position:relative;background:radial-gradient(70% 90% at 78% 25%,rgba(16,185,129,.36),transparent 65%),radial-gradient(60% 80% at 0% 100%,rgba(0,108,53,.48),transparent 70%),#0d1512;border-radius:0 0 40px 40px;overflow:hidden;padding-bottom:48px;min-height:min(94vh,840px);display:flex;flex-direction:column}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(80% 80% at 70% 40%,#000,transparent);pointer-events:none}
.hero>*{position:relative;z-index:1}
nav{display:flex;align-items:center;justify-content:space-between;padding:28px 0;gap:16px}
nav .links{display:flex;gap:20px;align-items:center;font-size:15px}
nav .links a.t{color:var(--mu);transition:color .2s}
nav .links a.t:hover,nav .links a.on{color:var(--tx)}
.logo{font:800 25px 'Barlow Condensed';letter-spacing:.01em}
.loc{font:600 11.5px 'JetBrains Mono',monospace;letter-spacing:.03em;color:var(--mu);border:1px solid var(--bd);padding:6px 13px 6px 11px;border-radius:99px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.loc i{width:6px;height:6px;border-radius:50%;background:var(--em);display:inline-block;box-shadow:0 0 0 3px rgba(16,185,129,.25)}
.pill{display:inline-flex;align-items:center;gap:14px;background:#fff;color:#0B0E0D;font-weight:700;font-size:14px;padding:6px 6px 6px 22px;border-radius:99px;transition:transform .2s,box-shadow .2s;white-space:nowrap}
.pill em{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--em);color:#fff;transition:transform .25s}
.pill:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(16,185,129,.4)}
.pill:hover em{transform:translateX(3px)}
.pill.g{background:var(--em);color:#04150d}.pill.g em{background:#fff;color:var(--deep)}
.pill.o{background:none;color:var(--tx);border:1px solid var(--bd);padding:8px 8px 8px 22px}.pill.o em{background:rgba(255,255,255,.08)}
.heroBody{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:end;margin-top:auto;padding-top:80px}
.heroBody .hi{font-size:22px;font-weight:600;margin-bottom:6px}
.heroBody aside h3{font:700 30px/1.2 Manrope;letter-spacing:-.01em;margin-bottom:12px}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:64px}
.pillars b{color:var(--em);font:600 13px 'JetBrains Mono',monospace}
.pillars div{border-top:1px solid var(--bd);padding-top:14px;font-size:15px}
.hero h1 span{display:block;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero h1 span+span{animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}

/* ---------- generic ---------- */
.strip{display:flex;align-items:center;gap:40px;padding:52px 0;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.strip small{max-width:130px;color:var(--mu);line-height:1.35;font-weight:600}
.strip ul{display:flex;gap:40px;flex-wrap:wrap;list-style:none;padding:0;font:700 25px 'Barlow Condensed';color:#d1d5db}
.sec{padding:104px 0}
.eyebrow{color:var(--em);font-weight:600;margin-bottom:12px}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

/* ---------- fan carousel ---------- */
.fanWrap{padding:64px 0 32px;text-align:center}
.fan{display:flex;justify-content:center;gap:14px;margin:48px 0 40px;perspective:1100px;overflow:hidden;padding:24px 0 8px}
.fan a{flex:0 0 clamp(100px,15vw,180px);aspect-ratio:3/4;border-radius:22px;overflow:hidden;position:relative;border:1px solid var(--bd);transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.fan a:hover{transform:translateY(-14px) scale(1.06)!important;box-shadow:0 20px 60px rgba(16,185,129,.35);z-index:2}
.fan a:hover .ph{transform:scale(1.1)}
.fan em{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;font:600 12px 'JetBrains Mono',monospace;font-style:normal;letter-spacing:.02em;background:linear-gradient(transparent,rgba(5,8,7,.85));text-align:left}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--g);transition:transform .6s cubic-bezier(.2,.7,.2,1)}

/* ---------- project cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:28px;overflow:hidden;backdrop-filter:blur(12px);transition:transform .3s,box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 50px rgba(16,185,129,.22);border-color:rgba(16,185,129,.45)}
.card:hover .ph{transform:scale(1.07)}
.thumb{position:relative;aspect-ratio:16/10;overflow:hidden}
.chip{position:absolute;left:14px;top:14px;background:rgba(5,8,7,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);color:#e5e7eb;font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.05em;text-transform:uppercase;padding:5px 12px;border-radius:99px;z-index:1}
.card .b{padding:22px 24px 26px;display:flex;flex-direction:column;gap:10px;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu)}
.meta.mono{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.03em}
.meta .view{color:var(--em);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:500 11.5px 'JetBrains Mono',monospace;letter-spacing:.01em;padding:4px 11px;border-radius:99px;border:1px solid var(--bd);color:#a7f3d0;background:rgba(16,185,129,.07)}

/* ---------- filters / archive ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:40px 0}
.filters button{font:600 13px 'JetBrains Mono',monospace;letter-spacing:.02em;color:var(--mu);background:none;border:1px solid var(--bd);border-radius:99px;padding:9px 20px;cursor:pointer;transition:.2s}
.filters button:hover{color:var(--tx)}
.filters button.on{background:var(--em);color:#04150d;border-color:var(--em)}

/* ---------- about / stats / skills ---------- */
.cvb{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:44px;padding-top:32px;border-top:1px solid var(--bd)}
.stats b{display:block;font:800 42px/1 'Barlow Condensed'}
.stats span{display:block;margin-top:8px;font:600 11.5px 'JetBrains Mono',monospace;letter-spacing:.03em;text-transform:uppercase;color:var(--mu);line-height:1.45}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:56px}
.skills>div{border:1px solid var(--bd);border-radius:24px;padding:24px;background:var(--card)}
.skills h3{font-size:24px;margin-bottom:14px}

/* ---------- background list ---------- */
.cols{display:grid;grid-template-columns:1fr 1.6fr;gap:48px;padding:40px 0;border-top:1px solid var(--bd)}
.cols p{max-width:68ch}
.cols ul{padding-left:18px;color:#d1d5db}
.cols ul li{margin-bottom:6px}
.it{padding-bottom:28px}
.it .meta{font-size:15px;align-items:flex-start;gap:16px}
.it .meta span{text-align:right;white-space:nowrap;font:600 12px 'JetBrains Mono',monospace;color:var(--mu)}

/* ---------- CTA / footer ---------- */
.cta{margin:0 auto 24px;border-radius:40px 40px 0 0;background:radial-gradient(60% 120% at 50% 120%,rgba(16,185,129,.35),transparent 70%),#0d1512;padding:100px 24px;text-align:center}
.cta h2{margin-bottom:28px}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:32px 0 48px;color:var(--mu);font-size:14px}
.fl{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
footer a:hover{color:var(--em)}
.adm{border:1px solid var(--bd);border-radius:99px;padding:6px 18px;color:var(--em);font:600 12px 'JetBrains Mono',monospace}
.adm:hover{background:var(--em);color:#04150d!important}

/* ---------- project detail ---------- */
.bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:24px;overflow:hidden;margin:40px 0}
.bar div{background:var(--bg);padding:18px 22px}
.bar small{display:block;color:var(--mu);font:600 11px 'JetBrains Mono',monospace;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.bar a{color:var(--em);margin-right:12px;font-weight:700}
.cover{position:relative;height:min(64vh,560px);border-radius:0 0 40px 40px;overflow:hidden;box-shadow:0 30px 120px -30px rgba(16,185,129,.4)}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(5,8,7,.55),transparent 30%);z-index:1}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--bg));z-index:1}
.cover .ttl{position:absolute;left:0;right:0;bottom:36px;z-index:2}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px}
.metrics div{border:1px solid var(--bd);border-radius:24px;padding:24px;background:var(--card)}
.metrics b{display:block;font:800 52px/1 'Barlow Condensed';color:var(--em)}
.metrics span{font:500 13px Manrope;color:var(--mu)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.gal button{position:relative;aspect-ratio:4/3;border:1px solid var(--bd);border-radius:20px;overflow:hidden;cursor:zoom-in;padding:0;background:none;transition:border-color .2s}
.gal button:hover{border-color:rgba(16,185,129,.5)}
.gal button:hover .ph{transform:scale(1.08)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:64px 0}
.pn a{border:1px solid var(--bd);border-radius:24px;padding:24px;transition:.25s}
.pn a:hover{border-color:var(--em);background:var(--card)}
.pn a+a{text-align:right}

/* ---------- lightbox ---------- */
#lb{position:fixed;inset:0;background:rgba(5,8,7,.95);display:none;place-items:center;z-index:50}
#lb.on{display:grid}
#lb img{max-width:88vw;max-height:82vh;border-radius:14px;cursor:zoom-out;box-shadow:0 30px 100px rgba(0,0,0,.6)}
#lb button{position:absolute;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:.2s}
#lb button:hover{background:var(--em);border-color:var(--em)}
#lbClose{top:24px;right:24px}
[data-lbnav="-1"]{left:24px;top:50%;transform:translateY(-50%)}
[data-lbnav="1"]{right:24px;top:50%;transform:translateY(-50%)}
#lbCount{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);color:var(--mu);font:600 12.5px 'JetBrains Mono',monospace;letter-spacing:.05em}

@media(max-width:800px){
  .heroBody,.cols,.stats{grid-template-columns:1fr}
  .stats{gap:32px}
  .pillars{grid-template-columns:1fr 1fr}
  nav .links .t,.loc{display:none}
  .pn{grid-template-columns:1fr}
  .it .meta{flex-direction:column;gap:4px}
  .it .meta span{text-align:left}
  #lb img{max-width:94vw;max-height:74vh}
  [data-lbnav]{width:38px;height:38px;font-size:18px}
  [data-lbnav="-1"]{left:8px}[data-lbnav="1"]{right:8px}
  #lbClose{top:12px;right:12px;width:38px;height:38px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.reveal{transition:opacity .01s linear!important;transform:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="lb" role="dialog" aria-label="Image viewer" aria-modal="true">
  <button id="lbClose" aria-label="Close">&times;</button>
  <button data-lbnav="-1" aria-label="Previous image">&#8249;</button>
  <img alt="">
  <button data-lbnav="1" aria-label="Next image">&#8250;</button>
  <span id="lbCount"></span>
</div>
<script>
let SITE = {}, C = {}, mail = '', GAL = [], LBI = 0;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = s => document.querySelector(s), app = $('#app');
let DATA = [];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grad = t => { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) % 360; const a = 140 + h % 40; return `linear-gradient(${h}deg,hsl(${a},70%,14%),hsl(${a + 20},80%,28%))`; };
const img = (src, t) => `<div class="ph" style="--g:${grad(t)}"></div>${src ? `<img class="ph" src="${esc(src)}" alt="${esc(t)}" loading="lazy" onerror="this.remove()">` : ''}`;
const arrow = (label, href, cls = '') => `<a class="pill ${cls}" href="${href}">${label}<em>&#8594;</em></a>`;
const basename = p => (p || '').split('/').pop();

const nav = p => `<nav class="wrap"><a class="logo" href="#/">${esc(SITE.name)}</a><div class="links">
<a class="t ${p === 'home' ? 'on' : ''}" href="#/">Home</a><a class="t" href="#/about" onclick="return aboutClick(event)">About</a>
<a class="t ${p === 'projects' ? 'on' : ''}" href="#/projects">Projects</a><span class="loc"><i></i>${esc(SITE.location)}</span>${arrow('Get in touch', mail)}</div></nav>`;

const card = (p, i) => `<a class="card reveal" style="transition-delay:${(i % 3) * 90}ms" href="#/projects/${esc(p.id)}">
<div class="thumb">${img(p.thumbnail, p.title)}<span class="chip">${esc(p.category)}</span></div>
<div class="b"><div class="meta mono"><span>${esc(p.year)}</span><span class="view">View project &#8594;</span></div><h3>${esc(p.title)}</h3>
<p class="mu">${esc(p.tagline)}</p><div class="tags">${(p.tags || []).slice(0, 4).map(t => `<span>${esc(t)}</span>`).join('')}</div></div></a>`;

const foot = () => `<section class="cta reveal"><h2>Have a machine that<br>needs building?</h2>${arrow('Email me', mail, 'g')}</section>
<footer class="wrap"><span>&copy; ${new Date().getFullYear()} ${esc(SITE.name)} &middot; ${esc(SITE.location)}</span><span class="fl"><a href="${esc(SITE.github)}" target="_blank" rel="noopener">GitHub</a><a href="${esc(SITE.linkedin)}" target="_blank" rel="noopener">LinkedIn</a><a class="adm" href="admin.html">Admin</a></span></footer>`;
const cvBtns = () => `<div class="cvb">${(SITE.cv || []).map(c => `<a class="pill o" href="${esc(c.file)}" download="${esc(basename(c.file))}">${esc(c.label)}<em>&#8595;</em></a>`).join('')}</div>`;
const statsRow = () => `<div class="stats">${(C.stats || []).map((s, i) => `<div class="reveal" style="transition-delay:${i * 80}ms"><b>${esc(s.v)}</b><span>${esc(s.l)}</span></div>`).join('')}</div>`;
const it = (t, s, d, pts) => `<div class="it reveal"><div class="meta"><b style="color:var(--tx)">${esc(t)}</b><span>${esc(d)}</span></div><p class="mu">${esc(s)}</p>${pts?.length ? `<ul>${pts.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>`;
const grp = (h, body) => body ? `<div class="cols"><h3 class="reveal">${h}</h3><div>${body}</div></div>` : '';

function aboutClick(e) {
  const home = !location.hash || location.hash === '#/' || location.hash.startsWith('#/about');
  if (home) { e.preventDefault(); history.replaceState(null, '', '#/about'); go('about'); return false; }
  return true;
}

function home() {
  const fan = DATA.slice(0, 8), mid = (fan.length - 1) / 2;
  return `<header class="hero"><div class="wrap" style="display:flex;flex-direction:column;flex:1;width:100%">${nav('home')}
<div class="heroBody"><div><p class="hi">${esc(SITE.hello)}</p><h1><span>${esc(SITE.role.split(' ')[0])}</span><span>${esc(SITE.role.split(' ').slice(1).join(' '))}</span></h1></div>
<aside><h3>${esc(SITE.pitch)}</h3><p class="mu">${esc(SITE.sub)}</p></aside></div>
<div class="pillars">${SITE.pillars.map((p, i) => `<div><b>#0${i + 1}</b><br>${esc(p)}</div>`).join('')}</div></div></header>
<div class="wrap"><div class="strip"><small>Built with tools I ship with</small><ul>${SITE.stack.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div></div>
<section class="wrap fanWrap"><span class="k reveal">Selected work</span><h2 class="reveal">Curious what else I've built?</h2>
<div class="fan">${fan.map((p, i) => { const o = i - mid; return `<a class="reveal" href="#/projects/${esc(p.id)}" style="transform:rotateY(${-o * 11}deg) translateY(${Math.abs(o) * 14}px)">${img(p.thumbnail, p.title)}<em>${esc(p.short)}</em></a>`; }).join('')}</div>
${arrow('See all projects', '#/projects')}</section>
<section class="wrap sec"><h2 class="reveal" style="margin-bottom:40px">Featured projects</h2><div class="grid">${DATA.slice(0, 3).map(card).join('')}</div></section>
<section class="wrap sec" id="about"><div class="cols" style="border:0;padding:0"><div><span class="k reveal">About</span><h2 class="reveal">${esc(SITE.aboutTitle)}</h2></div><div><p class="reveal" style="font-size:20px">${esc(SITE.summary)}</p>${cvBtns()}</div></div>
${statsRow()}
<div class="skills">${(C.skills || []).map((g, i) => `<div class="reveal" style="transition-delay:${i * 70}ms"><h3>${esc(g.group)}</h3><div class="tags">${(g.items || []).map(x => `<span>${esc(x)}</span>`).join('')}</div></div>`).join('')}</div></section>
<section class="wrap sec"><span class="k reveal">Career</span><h2 class="reveal" style="margin-bottom:24px">Background</h2>
${grp('Experience', (C.experience || []).map(e => it(e.role, e.company + ', ' + e.place, e.period, e.points)).join(''))}
${grp('Education', (C.education || []).map(e => it(e.degree, e.school, e.period)).join(''))}
${grp('Certifications', (C.certifications || []).map(e => it(e.title, e.issuer, e.date)).join(''))}
${grp('Languages', (C.languages || []).map(e => it(e.name, e.level, '')).join(''))}</section>${foot()}`;
}

function archive(cat = 'All') {
  const cats = ['All', ...new Set(DATA.map(p => p.category))];
  return `<header class="hero" style="min-height:0;padding-bottom:64px"><div class="wrap">${nav('projects')}<span class="k reveal" style="margin-top:56px;display:inline-block">Selected work</span><h1 class="reveal" style="font-size:clamp(60px,10vw,132px)">Projects</h1>
<p class="mu reveal" style="max-width:52ch;margin-top:20px">Robots, aircraft, and control systems, from first CAD sketch to bench and flight test.</p></div></header>
<section class="wrap"><div class="filters" role="group" aria-label="Filter by category">${cats.map(c => `<button class="${c === cat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
<div class="grid">${DATA.filter(p => cat === 'All' || p.category === cat).map(card).join('')}</div></section><div style="height:96px"></div>${foot()}`;
}

function detail(id) {
  const i = DATA.findIndex(p => p.id === id), p = DATA[i];
  if (!p) return `<div class="wrap">${nav('projects')}<h2 style="margin:80px 0 24px">Project not found</h2>${arrow('Back to projects', '#/projects')}</div>`;
  GAL = p.gallery || [];
  const prev = DATA[(i - 1 + DATA.length) % DATA.length], next = DATA[(i + 1) % DATA.length];
  const links = [['GitHub repo', p.githubUrl], ['Demo video', p.videoUrl], ['CAD files', p.cadUrl]].filter(l => l[1]).map(l => `<a href="${esc(l[1])}" target="_blank" rel="noopener">${l[0]}</a>`).join('') || '<span class="mu">Coming soon</span>';
  const sec = (h, body) => body ? `<div class="cols"><h3 class="reveal">${h}</h3><div>${body}</div></div>` : '';
  return `<div class="cover">${img(p.thumbnail, p.title)}<div class="wrap" style="position:absolute;inset:0;z-index:3">${nav('projects')}</div>
<div class="ttl wrap"><span class="k">${esc(p.category)}</span><h1 style="font-size:clamp(44px,8vw,108px)">${esc(p.title)}</h1></div></div>
<main class="wrap"><p style="font-size:22px;max-width:60ch;margin-top:32px" class="mu">${esc(p.tagline)}</p>
<div class="bar"><div><small>Timeline</small>${esc(p.timeline || p.year)}</div><div><small>Role</small>${esc(p.role || '—')}</div><div><small>Stack</small>${esc((p.tags || []).join(', '))}</div><div><small>Links</small>${links}</div></div>
${sec('Overview', `<p>${esc(p.summary)}</p>`)}
${sec('Key features', p.features?.length ? `<ul>${p.features.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : '')}
${sec('System architecture', p.architecture ? `<p>${esc(p.architecture)}</p>` : '')}
${sec('Results', (p.results ? `<p style="margin-bottom:24px">${esc(p.results)}</p>` : '') + (p.metrics?.length ? `<div class="metrics">${p.metrics.map(m => `<div><b>${esc(m.value)}</b><span>${esc(m.label)}</span></div>`).join('')}</div>` : ''))}
${p.gallery?.length ? `<div class="cols"><h3 class="reveal">Gallery</h3><div class="gal">${p.gallery.map((g, gi) => `<button class="reveal" style="transition-delay:${(gi % 3) * 80}ms" data-gi="${gi}" aria-label="Enlarge image ${gi + 1}">${img(g, p.title)}</button>`).join('')}</div></div>` : ''}
<div class="pn"><a href="#/projects/${esc(prev.id)}"><small class="mu">&#8592; Previous</small><h3>${esc(prev.title)}</h3></a><a href="#/projects/${esc(next.id)}"><small class="mu">Next &#8594;</small><h3>${esc(next.title)}</h3></a></div></main>${foot()}`;
}

function render() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  if (h[0] === 'about') { app.innerHTML = home(); document.title = SITE.name + ' | About'; afterRender(); setTimeout(() => go('about'), 60); return; }
  if (h[0] === 'projects' && h[1]) { app.innerHTML = detail(decodeURIComponent(h[1])); document.title = (DATA.find(p => p.id === h[1])?.title || 'Project') + ' | ' + SITE.name; }
  else if (h[0] === 'projects') { app.innerHTML = archive(); document.title = 'Projects | ' + SITE.name; }
  else { app.innerHTML = home(); document.title = SITE.name + ' | ' + SITE.role; }
  scrollTo(0, 0);
  afterRender();
}
function go(id) { document.getElementById(id)?.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth' }); }

let io;
function afterRender() {
  const els = document.querySelectorAll('.reveal:not(.in)');
  if (REDUCED) { els.forEach(e => e.classList.add('in')); return; }
  if (!io) io = new IntersectionObserver(ents => ents.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { threshold: .12, rootMargin: '0px 0px -40px 0px' });
  els.forEach(e => io.observe(e));
}

function openLB() {
  if (!GAL.length) return;
  $('#lb img').src = GAL[LBI];
  $('#lbCount').textContent = (LBI + 1) + ' / ' + GAL.length;
  document.querySelectorAll('[data-lbnav]').forEach(b => b.style.display = GAL.length > 1 ? 'grid' : 'none');
  $('#lb').classList.add('on');
}
function closeLB() { $('#lb').classList.remove('on'); }

document.addEventListener('click', e => {
  const f = e.target.closest('[data-c]');
  if (f) { const y = scrollY; app.innerHTML = archive(f.dataset.c); afterRender(); scrollTo(0, y); return; }
  const g = e.target.closest('[data-gi]');
  if (g) { LBI = +g.dataset.gi; openLB(); return; }
  const n = e.target.closest('[data-lbnav]');
  if (n) { LBI = (LBI + +n.dataset.lbnav + GAL.length) % GAL.length; openLB(); return; }
  if (e.target.id === 'lbClose' || e.target.id === 'lb' || e.target.closest('#lb img')) { closeLB(); return; }
});
document.addEventListener('keydown', e => {
  if (!$('#lb').classList.contains('on')) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft') { LBI = (LBI - 1 + GAL.length) % GAL.length; openLB(); }
  if (e.key === 'ArrowRight') { LBI = (LBI + 1) % GAL.length; openLB(); }
});
addEventListener('hashchange', render);

let draft = null;
if (location.search.includes('preview')) try { draft = JSON.parse(localStorage.getItem('draft')) } catch (e) { }
(draft ? Promise.resolve(draft) : fetch('content.json').then(r => r.json()))
  .then(c => { C = c; SITE = c.profile; DATA = c.projects; mail = 'mailto:' + SITE.email; render(); })
  .catch(() => { app.innerHTML = '<div class="wrap" style="padding:80px 0"><h2>Could not load content.json</h2><p class="mu" style="margin-top:16px">Serve this folder over HTTP (for example, <code>python3 -m http.server</code>) or deploy to GitHub Pages.</p></div>'; });
</script>
</body>
</html>
