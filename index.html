<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robotics & Engineering Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E0D;--card:rgba(255,255,255,.04);--em:#10B981;--deep:#006C35;--tx:#F9FAFB;--mu:#9CA3AF;--bd:rgba(16,185,129,.15)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 16px/1.6 Manrope,system-ui,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--em);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
h1,h2,h3,.disp{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;line-height:.92;letter-spacing:-.01em}
h1{font-size:clamp(64px,13vw,168px)}
h2{font-size:clamp(40px,6vw,76px)}
h3{font-size:28px;line-height:1}
.mu{color:var(--mu)}
.hero{position:relative;background:radial-gradient(70% 90% at 78% 30%,rgba(16,185,129,.38),transparent 65%),radial-gradient(60% 80% at 0% 100%,rgba(0,108,53,.5),transparent 70%),#0d1512;border-radius:0 0 40px 40px;overflow:hidden;padding-bottom:48px;min-height:min(92vh,820px);display:flex;flex-direction:column}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(80% 80% at 70% 40%,#000,transparent);pointer-events:none}
.hero>*{position:relative;z-index:1}
nav{display:flex;align-items:center;justify-content:space-between;padding:28px 0}
nav .links{display:flex;gap:32px;align-items:center;font-size:15px}
nav .links a.t{color:var(--mu);transition:color .2s}
nav .links a.t:hover,nav .links a.on{color:var(--tx)}
.logo{font:800 26px 'Barlow Condensed';letter-spacing:.01em}
.pill{display:inline-flex;align-items:center;gap:14px;background:#fff;color:#0B0E0D;font-weight:600;font-size:14px;padding:6px 6px 6px 22px;border-radius:99px;transition:transform .2s,box-shadow .2s}
.pill i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--em);color:#fff;font-style:normal;transition:transform .25s}
.pill:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(16,185,129,.4)}
.pill:hover i{transform:translateX(3px)}
.pill.g{background:var(--em);color:#04150d}.pill.g i{background:#fff;color:var(--deep)}
.heroBody{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:end;margin-top:auto;padding-top:80px}
.heroBody .hi{font-size:22px;font-weight:600;margin-bottom:8px}
.heroBody aside h3{font:700 32px/1.15 Manrope;letter-spacing:-.01em;margin-bottom:12px}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:64px}
.pillars b{color:var(--em);font-weight:600}
.pillars div{border-top:1px solid var(--bd);padding-top:14px;font-size:15px}
.hero h1 span{display:block;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero h1 span+span{animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}
.strip{display:flex;align-items:center;gap:40px;padding:56px 0;flex-wrap:wrap}
.strip small{max-width:130px;color:var(--mu);line-height:1.3;font-weight:600}
.strip ul{display:flex;gap:44px;flex-wrap:wrap;list-style:none;padding:0;font:700 26px 'Barlow Condensed';color:#d1d5db}
.sec{padding:96px 0}
.eyebrow{color:var(--em);font-weight:600;margin-bottom:12px}
.fanWrap{padding:64px 0 32px;text-align:center}
.fan{display:flex;justify-content:center;gap:14px;margin:48px 0 40px;perspective:1100px;overflow:hidden;padding:24px 0}
.fan a{flex:0 0 clamp(96px,14vw,172px);aspect-ratio:3/4;border-radius:22px;overflow:hidden;position:relative;border:1px solid var(--bd);transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.fan a:hover{transform:translateY(-14px) scale(1.06)!important;box-shadow:0 20px 60px rgba(16,185,129,.35);z-index:2}
.fan em{position:absolute;left:12px;bottom:10px;font:700 18px 'Barlow Condensed';font-style:normal}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:28px;overflow:hidden;backdrop-filter:blur(12px);transition:transform .3s,box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 50px rgba(16,185,129,.22);border-color:rgba(16,185,129,.45)}
.thumb{position:relative;aspect-ratio:16/10;overflow:hidden}
.card .b{padding:22px 24px 26px;display:flex;flex-direction:column;gap:10px;flex:1}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mu)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;padding:3px 11px;border-radius:99px;border:1px solid var(--bd);color:#a7f3d0;background:rgba(16,185,129,.07)}
.view{margin-top:auto;color:var(--em);font-weight:600;font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:40px 0}
.filters button{font:500 14px Manrope;color:var(--mu);background:none;border:1px solid var(--bd);border-radius:99px;padding:9px 20px;cursor:pointer;transition:.2s}
.filters button:hover{color:var(--tx)}
.filters button.on{background:var(--em);color:#04150d;border-color:var(--em)}
.pageHead{padding-bottom:8px}
.cta{margin:0 auto 24px;border-radius:40px 40px 0 0;background:radial-gradient(60% 120% at 50% 120%,rgba(16,185,129,.35),transparent 70%),#0d1512;padding:96px 24px;text-align:center}
.cta h2{margin-bottom:28px}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:32px 0 48px;color:var(--mu);font-size:14px}
footer a:hover{color:var(--em)}
.bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:24px;overflow:hidden;margin:40px 0}
.bar div{background:var(--bg);padding:18px 22px}
.bar small{display:block;color:var(--mu);font-size:13px}
.bar a{color:var(--em);margin-right:12px;font-weight:600}
.cover{position:relative;height:min(64vh,560px);border-radius:0 0 40px 40px;overflow:hidden;box-shadow:0 30px 120px -30px rgba(16,185,129,.45)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--bg))}
.cover .ttl{position:absolute;left:0;right:0;bottom:36px;z-index:2}
.cols{display:grid;grid-template-columns:1fr 1.6fr;gap:48px;padding:40px 0;border-top:1px solid var(--bd)}
.cols p{max-width:68ch}
.cols ul{padding-left:18px;color:#d1d5db}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px}
.metrics div{border:1px solid var(--bd);border-radius:24px;padding:24px;background:var(--card)}
.metrics b{display:block;font:800 56px/1 'Barlow Condensed';color:var(--em)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.gal button{position:relative;aspect-ratio:4/3;border:1px solid var(--bd);border-radius:20px;overflow:hidden;cursor:zoom-in;padding:0;background:none}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:64px 0}
.pn a{border:1px solid var(--bd);border-radius:24px;padding:24px;transition:.25s}
.pn a:hover{border-color:var(--em);background:var(--card)}
.pn a+a{text-align:right}
#lb{position:fixed;inset:0;background:rgba(5,8,7,.94);display:none;place-items:center;z-index:50;cursor:zoom-out}
#lb.on{display:grid}#lb img{max-width:92vw;max-height:88vh;border-radius:16px}
@media(max-width:800px){.heroBody,.cols{grid-template-columns:1fr}.pillars{grid-template-columns:1fr 1fr}nav .links .t{display:none}.pn{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="lb" role="dialog" aria-label="Image viewer"><img alt=""></div>
<script>
/* ---- Edit your identity here ---- */
const SITE = {
  name: "YourName",
  role: "Robotics Engineer",
  hello: "Hey, I'm a",
  pitch: "Machines that sense, decide, and move.",
  sub: "I design autonomous drones, robotic arms, and the embedded control and vision software that runs them.",
  email: "you@example.com",
  github: "https://github.com/yourname",
  linkedin: "https://linkedin.com/in/yourname",
  pillars: ["Autonomous Systems","Computer Vision","Mechanical CAD & FEA","Embedded Control"],
  stack: ["ROS 2","OpenCV","PyMAVLink","SolidWorks","Python","C++","STM32"]
};

const $ = s => document.querySelector(s), app = $('#app');
let DATA = [];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grad = t => { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) % 360; const a = 140 + h % 40; return `linear-gradient(${h}deg,hsl(${a},70%,14%),hsl(${a + 20},80%,28%))`; };
const img = (src, t) => `<div class="ph" style="--g:${grad(t)}"></div>${src ? `<img class="ph" src="${esc(src)}" alt="${esc(t)}" loading="lazy" onerror="this.remove()">` : ''}`;
const arrow = (label, href, cls = '') => `<a class="pill ${cls}" href="${href}">${label}<i>→</i></a>`;
const mail = `mailto:${SITE.email}`;

const nav = p => `<nav class="wrap"><a class="logo" href="#/">${esc(SITE.name)}</a><div class="links">
<a class="t ${p === 'home' ? 'on' : ''}" href="#/">Home</a><a class="t" href="#contact" onclick="go('contact');return false">About</a>
<a class="t ${p === 'projects' ? 'on' : ''}" href="#/projects">Projects</a>${arrow('Get in touch', mail)}</div></nav>`;

const card = p => `<a class="card" href="#/projects/${esc(p.id)}"><div class="thumb">${img(p.thumbnail, p.title)}</div>
<div class="b"><div class="meta"><span>${esc(p.category)}</span><span>${esc(p.year)}</span></div><h3>${esc(p.title)}</h3>
<p class="mu">${esc(p.tagline)}</p><div class="tags">${(p.tags || []).slice(0, 4).map(t => `<span>${esc(t)}</span>`).join('')}</div>
<span class="view">View project →</span></div></a>`;

const foot = `<section class="cta" id="contact"><h2>Have a machine that<br>needs building?</h2>${arrow('Email me', mail, 'g')}</section>
<footer class="wrap"><span>© ${new Date().getFullYear()} ${esc(SITE.name)}</span><span><a href="${SITE.github}">GitHub</a> &nbsp; <a href="${SITE.linkedin}">LinkedIn</a></span></footer>`;

function home() {
  const fan = DATA.slice(0, 7), mid = (fan.length - 1) / 2;
  return `<header class="hero"><div class="wrap" style="display:flex;flex-direction:column;flex:1;width:100%">${nav('home')}
<div class="heroBody"><div><p class="hi">${esc(SITE.hello)}</p><h1><span>${esc(SITE.role.split(' ')[0])}</span><span>${esc(SITE.role.split(' ').slice(1).join(' '))}</span></h1></div>
<aside><h3>${esc(SITE.pitch)}</h3><p class="mu">${esc(SITE.sub)}</p></aside></div>
<div class="pillars">${SITE.pillars.map((p, i) => `<div><b>#0${i + 1}</b><br>${esc(p)}</div>`).join('')}</div></div></header>
<div class="wrap"><div class="strip"><small>Built with tools I ship with</small><ul>${SITE.stack.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div></div>
<section class="wrap fanWrap"><p class="eyebrow">Selected work</p><h2>Curious what else I've built?</h2>
<div class="fan">${fan.map((p, i) => { const o = i - mid; return `<a href="#/projects/${esc(p.id)}" style="transform:rotateY(${-o * 11}deg) translateY(${Math.abs(o) * 14}px)">${img(p.thumbnail, p.title)}<em>${esc(p.title.split(' ').slice(0, 2).join(' '))}</em></a>`; }).join('')}</div>
${arrow('See all projects', '#/projects')}</section>
<section class="wrap sec"><h2 style="margin-bottom:40px">Featured projects</h2><div class="grid">${DATA.slice(0, 3).map(card).join('')}</div></section>${foot}`;
}

function archive(cat = 'All') {
  const cats = ['All', ...new Set(DATA.map(p => p.category))];
  return `<header class="hero" style="min-height:0;padding-bottom:64px"><div class="wrap">${nav('projects')}<p class="eyebrow" style="margin-top:56px">Selected work</p><h1 style="font-size:clamp(64px,11vw,140px)">Projects</h1>
<p class="mu" style="max-width:52ch;margin-top:20px">Robots, aircraft, and control systems, from first CAD sketch to flight or bench test.</p></div></header>
<section class="wrap"><div class="filters" role="group" aria-label="Filter by category">${cats.map(c => `<button class="${c === cat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
<div class="grid">${DATA.filter(p => cat === 'All' || p.category === cat).map(card).join('')}</div></section><div style="height:96px"></div>${foot}`;
}

function detail(id) {
  const i = DATA.findIndex(p => p.id === id), p = DATA[i];
  if (!p) return `<div class="wrap">${nav('projects')}<h2 style="margin:80px 0 24px">Project not found</h2>${arrow('Back to projects', '#/projects')}</div>`;
  const prev = DATA[(i - 1 + DATA.length) % DATA.length], next = DATA[(i + 1) % DATA.length];
  const links = [['GitHub repo', p.githubUrl], ['Demo video', p.videoUrl], ['CAD files', p.cadUrl]].filter(l => l[1]).map(l => `<a href="${esc(l[1])}" target="_blank" rel="noopener">${l[0]}</a>`).join('') || '<span class="mu">Coming soon</span>';
  const sec = (h, body) => body ? `<div class="cols"><h3>${h}</h3><div>${body}</div></div>` : '';
  return `<div class="cover">${img(p.thumbnail, p.title)}<div class="wrap" style="position:absolute;inset:0;z-index:3">${nav('projects')}</div>
<div class="ttl wrap"><p class="eyebrow">${esc(p.category)}</p><h1 style="font-size:clamp(48px,9vw,120px)">${esc(p.title)}</h1></div></div>
<main class="wrap"><p style="font-size:22px;max-width:60ch;margin-top:32px" class="mu">${esc(p.tagline)}</p>
<div class="bar"><div><small>Timeline</small>${esc(p.timeline || p.year)}</div><div><small>Role</small>${esc(p.role || '—')}</div><div><small>Stack</small>${esc((p.tags || []).join(', '))}</div><div><small>Links</small>${links}</div></div>
${sec('Overview', `<p>${esc(p.summary)}</p>`)}
${sec('Key features', p.features?.length ? `<ul>${p.features.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : '')}
${sec('System architecture', p.architecture ? `<p>${esc(p.architecture)}</p>` : '')}
${sec('Results', (p.results ? `<p style="margin-bottom:24px">${esc(p.results)}</p>` : '') + (p.metrics?.length ? `<div class="metrics">${p.metrics.map(m => `<div><b>${esc(m.value)}</b>${esc(m.label)}</div>`).join('')}</div>` : ''))}
${p.gallery?.length ? `<div class="cols"><h3>Gallery</h3><div class="gal">${p.gallery.map(g => `<button data-lb="${esc(g)}" aria-label="Enlarge image">${img(g, p.title)}</button>`).join('')}</div></div>` : ''}
<div class="pn"><a href="#/projects/${esc(prev.id)}"><small class="mu">← Previous</small><h3>${esc(prev.title)}</h3></a><a href="#/projects/${esc(next.id)}"><small class="mu">Next →</small><h3>${esc(next.title)}</h3></a></div></main>${foot}`;
}

function render() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  if (h[0] === 'contact') return;
  if (h[0] === 'projects' && h[1]) { app.innerHTML = detail(decodeURIComponent(h[1])); document.title = (DATA.find(p => p.id === h[1])?.title || 'Project') + ' | ' + SITE.name; }
  else if (h[0] === 'projects') { app.innerHTML = archive(); document.title = 'Projects | ' + SITE.name; }
  else { app.innerHTML = home(); document.title = SITE.name + ' | ' + SITE.role; }
  scrollTo(0, 0);
}
function go(id) { document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' }); }

document.addEventListener('click', e => {
  const f = e.target.closest('[data-c]');
  if (f) { const y = scrollY; app.innerHTML = archive(f.dataset.c); scrollTo(0, y); }
  const l = e.target.closest('[data-lb]');
  if (l) { $('#lb img').src = l.dataset.lb; $('#lb').classList.add('on'); }
  else if (e.target.closest('#lb')) $('#lb').classList.remove('on');
});
document.addEventListener('keydown', e => e.key === 'Escape' && $('#lb').classList.remove('on'));
addEventListener('hashchange', render);

fetch('projects.json').then(r => r.json()).then(d => { DATA = d; render(); })
  .catch(() => { app.innerHTML = '<div class="wrap" style="padding:80px 0"><h2>Could not load projects.json</h2><p class="mu" style="margin-top:16px">Serve this folder over HTTP (for example, <code>python3 -m http.server</code>) or deploy to GitHub Pages.</p></div>'; });
</script>
</body>
</html>
