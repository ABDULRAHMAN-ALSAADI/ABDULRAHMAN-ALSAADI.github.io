<script>
(function(){
var D=JSON.parse(document.getElementById('d').textContent),fails=0,f=document.getElementById('f'),e=document.getElementById('e'),b=document.getElementById('b');
var u8=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
async function open(pw){
  var enc=new TextEncoder(),km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.n)},key,u8(D.c)));
}
f.addEventListener('submit',async function(ev){
  ev.preventDefault();
  if(!window.crypto||!crypto.subtle){e.textContent='This page needs HTTPS (or localhost).';return}
  b.disabled=true;e.textContent='';
  try{var html=await open(document.getElementById('p').value);document.open();document.write(html);document.close()}
  catch(x){fails++;var wait=Math.min(Math.pow(2,fails)*600,10000);e.textContent='Wrong password. Wait '+Math.round(wait/1000)+'s.';setTimeout(function(){b.disabled=false},wait);document.getElementById('p').select()}
});
})();
