<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project admin</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0B0E0D;color:#F9FAFB;font:15px/1.5 system-ui,sans-serif;padding:32px;max-width:900px;margin-inline:auto}
h1{font-size:28px}label{display:block;margin:14px 0 4px;color:#9CA3AF;font-size:13px}
input,textarea{width:100%;background:#111815;color:#F9FAFB;border:1px solid rgba(16,185,129,.3);border-radius:10px;padding:10px;font:inherit}
button{background:#10B981;color:#04150d;border:0;border-radius:99px;padding:10px 20px;font-weight:600;cursor:pointer;margin:16px 8px 0 0}
button.s{background:none;color:#F9FAFB;border:1px solid rgba(16,185,129,.4)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(16,185,129,.15)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}
</style></head><body>
<h1>Project admin</h1>
<p style="color:#9CA3AF">Edit projects here, click <b>Download projects.json</b>, then replace the file in your repo and commit. Drafts are kept in this browser until you download.</p>
<div id="list"></div>
<h2 id="mode">New project</h2>
<div class="g"><div><label>ID (URL slug)</label><input id="id"></div><div><label>Title</label><input id="title"></div>
<div><label>Category</label><input id="category" placeholder="UAVs & Drones"></div><div><label>Year</label><input id="year"></div>
<div><label>Thumbnail path</label><input id="thumbnail" placeholder="images/projects/name.jpg"></div><div><label>GitHub URL</label><input id="githubUrl"></div></div>
<label>Tagline</label><input id="tagline"><label>Tags (comma separated)</label><input id="tags">
<label>Summary</label><textarea id="summary" rows="3"></textarea>
<label>Features (one per line)</label><textarea id="features" rows="3"></textarea>
<label>Metrics (one per line, Label: Value)</label><textarea id="metrics" rows="2"></textarea>
<label>Gallery image paths (one per line)</label><textarea id="gallery" rows="2"></textarea>
<button id="save">Save project</button><button class="s" id="clear">Clear form</button><button class="s" id="dl">Download projects.json</button>
<script>
const $=i=>document.getElementById(i),F=['id','title','category','year','thumbnail','githubUrl','tagline','summary'];
let D=[];
const lines=t=>t.split('\n').map(s=>s.trim()).filter(Boolean);
const persist=()=>{try{localStorage.setItem('draft',JSON.stringify(D))}catch(e){}};
function draw(){$('list').innerHTML=D.map((p,i)=>`<div class="row"><span>${p.title} <small style="color:#9CA3AF">${p.category}, ${p.year}</small></span><span><button class="s" data-e="${i}">Edit</button><button class="s" data-d="${i}">Delete</button></span></div>`).join('')}
function fill(p={}){F.forEach(k=>$(k).value=p[k]||'');$('tags').value=(p.tags||[]).join(', ');$('features').value=(p.features||[]).join('\n');
$('metrics').value=(p.metrics||[]).map(m=>m.label+': '+m.value).join('\n');$('gallery').value=(p.gallery||[]).join('\n');$('mode').textContent=p.id?'Edit project':'New project'}
document.addEventListener('click',e=>{const b=e.target;
if(b.dataset.e)fill(D[b.dataset.e]);
if(b.dataset.d&&confirm('Delete this project?')){D.splice(b.dataset.d,1);persist();draw()}});
$('save').onclick=()=>{const p={};F.forEach(k=>p[k]=$(k).value.trim());
if(!p.id||!p.title){alert('ID and title are required.');return}
p.tags=$('tags').value.split(',').map(s=>s.trim()).filter(Boolean);p.features=lines($('features').value);
p.metrics=lines($('metrics').value).map(l=>{const[a,...r]=l.split(':');return{label:a.trim(),value:r.join(':').trim()}});
p.gallery=lines($('gallery').value);const i=D.findIndex(x=>x.id===p.id);
i>=0?D[i]={...D[i],...p}:D.push(p);persist();draw();fill()};
$('clear').onclick=()=>fill();
$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='projects.json';a.click()};
(async()=>{let d=null;try{d=JSON.parse(localStorage.getItem('draft'))}catch(e){}
if(!d)try{d=await (await fetch('projects.json')).json()}catch(e){d=[]}
D=d;draw()})();
</script></body></html>
